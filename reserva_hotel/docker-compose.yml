services:

  gateway:
    build: ./gateway
    ports:
        - "5000:5000"
    environment:
        RESERVAS_URL: ${RESERVAS_URL}
        USUARIOS_URL: ${USUARIOS_URL}
        HABITACIONES_URL: ${HABITACIONES_URL}
    depends_on:
        - reservas
        - usuarios
  reservas:
    build: ./reservas
    ports:
      - "5002:5000"
    env_file:
      - .env
    depends_on:
      - mysql_reservas
      - usuarios
      - habitaciones

  usuarios:
    build: ./usuarios
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      - mysql_usuarios


  habitaciones:
    build: ./habitaciones
    ports:
      - "5003:5000"
    env_file:
      - .env
    depends_on:
      - mysql_habitaciones


  mysql_reservas:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_reservas
    ports:
      - "3309:3306"
    volumes:
      - reservas_mysql_data:/var/lib/mysql 


  mysql_usuarios:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_usuarios
    ports:
      - "3310:3306"
    volumes:
      - usuarios_mysql_data:/var/lib/mysql

  mysql_habitaciones:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_habitaciones
    ports:
      - "3311:3306"
    volumes:
      - habitaciones_mysql_data:/var/lib/mysql
volumes:
  reservas_mysql_data:
  usuarios_mysql_data:
  habitaciones_mysql_data:


